name: Build StickS3 mic firmware

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-sticks3-firmware.yml"
      - "firmware/**"
      - "protocol/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build python3-venv pkg-config libssl-dev

      - name: Cache ESP-IDF tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.espressif
            ~/.cargo/registry
            ~/.cargo/git
          key: espidf-${{ runner.os }}-v5.3.2-${{ hashFiles('Cargo.lock', 'firmware/components_esp32s3.lock') }}
          restore-keys: |
            espidf-${{ runner.os }}-v5.3.2-

      - name: Install Xtensa Rust toolchain
        uses: esp-rs/xtensa-toolchain@v1.7
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: true

      - name: Build firmware
        working-directory: firmware
        run: cargo build --release

      - name: Collect binaries
        run: |
          set -euo pipefail
          APP=$(find firmware/target -type f -name 'm5mic-firmware.bin' | head -n1)
          if [ -z "$APP" ]; then
            echo "app image not found; bins present:" >&2
            find firmware/target -type f -name '*.bin' >&2 || true
            exit 1
          fi
          BUILD_DIR=$(dirname "$APP")
          echo "build dir: $BUILD_DIR"

          # Launcher / OTA-style app image (starts with 0xe9)
          cp "$APP" m5mic-sticks3-launcher.bin
          test "$(od -An -tx1 -N1 m5mic-sticks3-launcher.bin | tr -d ' \n')" = "e9"

          # Full merged image for M5Burner / esptool at 0x0
          python3 -m venv /tmp/esptool-venv
          /tmp/esptool-venv/bin/pip install --quiet 'esptool==4.8.1'
          /tmp/esptool-venv/bin/python -m esptool --chip esp32s3 merge_bin \
            -o m5mic-sticks3-merged.bin \
            --flash_mode qio --flash_freq 80m --flash_size 8MB \
            0x0 "$BUILD_DIR/bootloader/bootloader.bin" \
            0x8000 "$BUILD_DIR/partition_table/partition-table.bin" \
            0x10000 "$APP"

          ls -l m5mic-sticks3-*.bin
          sha256sum m5mic-sticks3-*.bin | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: m5mic-sticks3
          path: |
            m5mic-sticks3-merged.bin
            m5mic-sticks3-launcher.bin
            SHA256SUMS.txt
          if-no-files-found: error
