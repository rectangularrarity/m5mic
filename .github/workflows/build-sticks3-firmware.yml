name: Build StickS3 mic firmware

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-sticks3-firmware.yml"
      - "firmware/**"
      - "protocol/**"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build python3-venv pkg-config libssl-dev \
            libffi-dev libxml2 libxml2-dev libusb-1.0-0

      - name: Cache ESP-IDF tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.espressif
            ~/.cargo/registry
            ~/.cargo/git
          key: espidf-noble-v5.3.2-${{ hashFiles('Cargo.lock', 'firmware/components_esp32s3.lock') }}
          restore-keys: |
            espidf-noble-v5.3.2-

      - name: Install Xtensa Rust toolchain
        uses: esp-rs/xtensa-toolchain@v1.7
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: true

      - name: Build firmware
        working-directory: firmware
        run: cargo build --release

      - name: Collect binaries
        run: |
          set -euo pipefail
          RELEASE=firmware/target/xtensa-esp32s3-espidf/release
          ELF="$RELEASE/m5mic-firmware"
          test -f "$ELF"
          file "$ELF"

          # espflash turns the Rust ELF into a proper ESP app image.
          curl -sSL -o /tmp/espflash.zip \
            https://github.com/esp-rs/espflash/releases/latest/download/espflash-x86_64-unknown-linux-gnu.zip
          unzip -oq /tmp/espflash.zip -d /tmp/espflash
          ESPFLASH=$(find /tmp/espflash -type f -name espflash | head -n1)
          chmod +x "$ESPFLASH"
          "$ESPFLASH" --version

          # App image for M5Launcher (starts with 0xe9)
          "$ESPFLASH" save-image --chip esp32s3 \
            --flash-size 8mb --flash-mode qio --flash-freq 80mhz \
            "$ELF" m5mic-sticks3-launcher.bin

          # Full merged image for M5Burner / esptool at 0x0
          "$ESPFLASH" save-image --chip esp32s3 \
            --flash-size 8mb --flash-mode qio --flash-freq 80mhz \
            --merge "$ELF" m5mic-sticks3-merged.bin

          test "$(od -An -tx1 -N1 m5mic-sticks3-launcher.bin | tr -d ' \n')" = "e9"
          test "$(od -An -tx1 -N1 m5mic-sticks3-merged.bin | tr -d ' \n')" = "e9"
          APP_SIZE=$(stat -c%s m5mic-sticks3-launcher.bin)
          test "$APP_SIZE" -le $((0x4D0000))

          ls -l m5mic-sticks3-*.bin
          sha256sum m5mic-sticks3-*.bin | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: m5mic-sticks3
          path: |
            m5mic-sticks3-merged.bin
            m5mic-sticks3-launcher.bin
            SHA256SUMS.txt
          if-no-files-found: error
